name: Atualizar dados

on:
  schedule:
    - cron: '17 */3 * * *'   # a cada 3 horas
  workflow_dispatch:
    inputs:
      temporada:
        description: 'Ano da temporada (vazio = ano atual)'
        required: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar jogos do Sofascore
        env:
          TEMPORADA: ${{ inputs.temporada }}
        run: |
          if [ -n "$TEMPORADA" ]; then
            node scripts/atualizar-dados.mjs --temporada "$TEMPORADA"
          else
            node scripts/atualizar-dados.mjs
          fi

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- data/brasileirao.json; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brasileirao.json
          git commit -m "Atualiza dados do Brasileirão"
          git push
