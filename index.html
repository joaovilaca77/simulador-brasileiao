<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liga Draft Cartola</title>
  <meta name="description" content="Draft ao vivo da liga de Cartola: ordem em serpentina, relógio por escolha e elencos de 23 jogadores.">
  <meta name="theme-color" content="#131428">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <script>
    // Aplica o tema salvo (ou o do sistema) antes de desenhar a página.
    (function () {
      var tema = null;
      try { tema = localStorage.getItem('simulador:tema'); } catch (e) {}
      if (tema !== 'claro' && tema !== 'escuro') {
        tema = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      }
      document.documentElement.dataset.tema = tema;
    })();
  </script>
  <link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=daefe94a8f">
  <script type="module" src="js/app.js?v=daefe94a8f"></script>
</head>
<body>
  <header class="faixa">
    <svg class="faixa-padrao" viewBox="0 0 420 160" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
      <polygon points="150,0 200,0 115,160 65,160" fill="#262949"/>
      <polygon points="212,0 236,0 151,160 127,160" fill="#c7ff00"/>
      <polygon points="248,0 330,0 245,160 163,160" fill="#262949"/>
      <polygon points="342,0 372,0 287,160 257,160" fill="#c7ff00"/>
      <polygon points="384,0 420,0 420,160 299,160" fill="#c7ff00" opacity="0.55"/>
    </svg>

    <div class="topo">
      <a class="marca" href="#/">
        <img class="emblema" src="img/brasileirao-emblema.png" alt="" width="66" height="64">
        <div>
          <p class="sobretitulo">Liga Draft</p>
          <h1 id="titulo-pagina">Cartola</h1>
          <p id="subtitulo-pagina" class="atualizado"></p>
        </div>
      </a>
      <div class="acoes-topo">
        <button id="btn-tema" class="botao tema" type="button" aria-label="Alternar tema claro ou escuro">
          <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
          <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </button>
        <div class="conta">
          <button id="btn-entrar" class="botao primario" type="button" hidden>Entrar com Google</button>
          <div id="usuario" class="usuario" hidden>
            <img id="usuario-foto" alt="" referrerpolicy="no-referrer" width="30" height="30">
            <span id="usuario-nome"></span>
            <button id="btn-sair" class="botao link" type="button">Sair</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="aviso" class="aviso" role="status" hidden></div>

  <main id="app">
    <p class="carregando">Carregando…</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="assertive" hidden></div>

  <footer class="rodape">
    <div>
      Liga feita por amigos, sem vínculo com a Globo, o Cartola FC, a CBF ou os clubes.
      Cartola FC é marca da Globo; Brasileirão e seu logotipo são marcas da CBF; escudos são marcas dos respectivos clubes.
      Jogadores: <span id="fonte-dados">Cartola FC</span>.
    </div>
  </footer>
</body>
</html>
